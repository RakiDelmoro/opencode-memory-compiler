[project]
name = "opencode-memory-compiler"
version = "1.0.0"
description = "A persistent knowledge base system for Opencode conversations"
authors = [{name = "OpenMemory Contributor"}]
dependencies = [
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "mcp[cli]>=1.0.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts"]

[tool.uv]
sources = []

[project.scripts]
# Optional: expose commands directly
opencode-compile = "scripts.compile:main"
opencode-query = "scripts.query:main"
opencode-lint = "scripts.lint:main"
opencode-flush = "scripts.flush:main"